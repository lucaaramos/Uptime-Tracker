services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: uptime_tracker

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB: "uptime_tracker"
      REDIS_ADDR: "redis:6379"
      RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672/"
      JWT_SECRET: "change-me-in-production"
      SCHEDULER_INTERVAL: "10s"
      WORKER_COUNT: "5"
      LOG_LEVEL: "debug"
      CHECK_RETENTION_DAYS: "30"
      ALLOW_PRIVATE_URLS: "true"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  test-api:
    build:
      context: ./test-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
